name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
    contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docs named in the README exist
        run: |
          set -eu
          test -s README.md
          test -s NOTES.md
          test -s LICENSE
          test -d docs

      - name: Local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress '**/*.md'
          fail: true
